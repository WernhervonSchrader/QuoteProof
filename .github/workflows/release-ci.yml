name: Release CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.6"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # pragma: allowlist secret

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Verify lock and sync
        run: |
          uv lock --check
          uv sync --frozen --dev
      - name: Ruff format
        run: uv run --frozen ruff format --check src tests scripts
      - name: Ruff lint
        run: uv run --frozen ruff check src tests scripts
      - name: Mypy strict
        run: uv run --frozen mypy src
      - name: Tests and branch coverage
        run: >-
          uv run --frozen pytest -q --cov=quoteproof --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml

  security:
    name: Security and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Frozen sync
        run: uv sync --frozen --dev
      - name: Reject tracked credential files and values
        run: uv run --frozen python scripts/check_tracked_credentials.py
      - name: Bandit SAST
        run: uv run --frozen bandit -q -r src
      - name: Dependency audit
        run: |
          mkdir -p artifacts
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file artifacts/runtime-requirements.txt
          uv run --frozen pip-audit --strict --require-hashes --disable-pip \
            --requirement artifacts/runtime-requirements.txt --progress-spinner off \
            --format json --output artifacts/pip-audit.json
      - name: Detect-secrets working-tree scan
        run: git ls-files -z | xargs -0 uv run --frozen detect-secrets-hook
      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: artifacts/pip-audit.json
          if-no-files-found: error

  gitleaks:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$url"
          echo "$GITLEAKS_LINUX_X64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan all reachable history
        shell: bash
        run: |
          mkdir -p artifacts
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact \
            --report-format json --report-path artifacts/gitleaks-all-refs.json
      - name: Upload Gitleaks evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-all-refs
          path: artifacts/gitleaks-all-refs.json
          if-no-files-found: error

  build:
    name: Build, clean install, and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Frozen sync
        run: uv sync --frozen --dev
      - name: Build wheel and sdist with locked backend
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-build-isolation --out-dir dist
      - name: Export hashed runtime lock
        run: |
          mkdir -p artifacts
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file artifacts/runtime-requirements.txt
      - name: Clean install from artifact and locked dependencies
        run: |
          uv venv .clean-venv --python 3.13
          uv pip install --python .clean-venv/bin/python --require-hashes \
            --requirements artifacts/runtime-requirements.txt
          uv pip install --python .clean-venv/bin/python --no-deps dist/*.whl
          .clean-venv/bin/python -c "from quoteproof.scenarios import load_scenario; assert load_scenario('pass').quote_id == 'QP-DEMO-PASS'"
      - name: Generate reproducible CycloneDX SBOM
        run: >-
          uv run --frozen cyclonedx-py environment .clean-venv/bin/python
          --pyproject pyproject.toml --output-reproducible --output-format JSON
          --output-file artifacts/quoteproof.cdx.json --validate
      - name: Hash release artifacts
        run: sha256sum dist/* artifacts/quoteproof.cdx.json > artifacts/SHA256SUMS
      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: |
            dist/*
            artifacts/quoteproof.cdx.json
            artifacts/runtime-requirements.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
