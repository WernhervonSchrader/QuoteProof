name: Check OpenAI secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    name: Verify protected secret
    runs-on: ubuntu-latest
    steps:
      - name: Confirm OPENAI_API_KEY is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured in repository secrets."
            exit 1
          fi

          case "$OPENAI_API_KEY" in
            sk-*)
              echo "OPENAI_API_KEY is configured as a protected GitHub secret."
              ;;
            *)
              echo "::error::OPENAI_API_KEY does not have the expected key format."
              exit 1
              ;;
          esac
