[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quoteproof"
version = "0.1.0"
description = "A governed LangGraph workflow for reviewing AI-generated quotations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.0.10,<2",
  "openai>=2,<3",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "cyclonedx-bom>=6,<7",
  "detect-secrets>=1.5,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quoteproof"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.audit-mirror",
  "/.clean-venv*",
  "/.tools",
  "/.uv-cache",
  "/.venv",
  "/artifacts",
  "/dist",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["quoteproof"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
packages = ["quoteproof"]

[tool.vercel]
entrypoint = "src.quoteproof.api:app"
