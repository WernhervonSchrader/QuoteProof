[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quoteproof"
version = "0.1.0"
description = "A governed LangGraph workflow for reviewing AI-generated quotations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<1",
  "openai>=2,<3",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quoteproof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.quoteproof.api:app"
